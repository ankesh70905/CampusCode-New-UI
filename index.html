<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CampusCode is the digital home for student innovation."
    />
    <meta name="theme-color" content="#f3f6f7" />
    <title>CampusCode — Hackathon Arena</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('campuscode-theme');
        const preferredTheme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = preferredTheme === 'dark' ? 'dark' : 'light';
      } catch (error) {
        console.error('Unable to read the CampusCode theme preference.', error);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This site requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
